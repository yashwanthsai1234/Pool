# Pull requests: install, lint, typecheck, unit, browser and integration tests on Node 24.22 and 26.
# The nightly jobs (fuzzing, mutation, Quint, Testnet, ZK, model run) live in nightly.yml and never block a pull request.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 12.11.2

jobs:
  checks:
    name: lint, typecheck and unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.22', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # OpenSSL 3 is needed by the fixtures test (P1.8-04, `openssl cms -verify`).
      - name: Check OpenSSL 3
        run: |
          openssl version
          openssl version | grep -q '^OpenSSL 3\.'
      - run: pnpm test

  browser:
    name: browser (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.22', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium and WebKit
        run: pnpm --filter ./apps/web exec playwright install --with-deps chromium webkit
      - name: Browser tests
        env:
          LEGX_BROWSER: '1'
        run: pnpm vitest run --project browser --project vault-browser --project core-browser

  integration:
    name: integration (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.22', '26']
    env:
      XRPLD_WS: ws://127.0.0.1:6006
      LEGX_PG_URL: postgres://postgres:pw@127.0.0.1:5432/postgres
      # Per-package overrides that the tests read; they point at the same CI services.
      LEGX_32_LEDGER: ws://127.0.0.1:6006
      LEGX_39_LEDGER: ws://127.0.0.1:6006
      LEGX_32_PG: postgres://postgres:pw@127.0.0.1:5432/postgres
      LEGX_39_PG: postgres://postgres:pw@127.0.0.1:5432/postgres
      LEGX_310_PG: postgres://postgres:pw@127.0.0.1:5432/postgres
      LEGX_37_PG: postgres://postgres:pw@127.0.0.1:5432/postgres
      LEGX_37_LEDGER: ws://127.0.0.1:6006
      LEGX_45_LEDGER_WS: ws://127.0.0.1:6006
      # The db schema test execs into the Postgres container by name (the service container is started below as legx-pg).
      LEGX_PG_CONTAINER: legx-pg
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Postgres
        run: |
          docker run -d --name legx-pg -e POSTGRES_PASSWORD=pw -p 5432:5432 postgres:18.6-trixie
          until docker exec legx-pg pg_isready -U postgres; do sleep 2; done
      - name: Start standalone xrpld
        run: |
          docker run -d --platform linux/amd64 --name legx-xrpld \
            -p 6006:6006 -v "$PWD/ci:/etc/xrpld/" \
            rippleci/xrpld:3.4.1 --standalone
      - name: Wait for the ledger
        run: node packages/xrpl/scripts/wait-ledger.ts
      - name: Integration tests
        run: pnpm vitest run --project integration
      - name: xrpld logs
        if: always()
        run: docker logs legx-xrpld || true
      - name: Stop xrpld
        if: always()
        run: docker rm -f legx-xrpld legx-pg || true

  system:
    name: system (SYS-01, A1 to A16, I1 to I3)
    runs-on: ubuntu-latest
    env:
      LEGX_SYS_PG: postgres://postgres:pw@127.0.0.1:5520/postgres
      LEGX_SYS_LEDGER: ws://127.0.0.1:6120
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the system containers
        run: |
          docker run -d --name legx-sys-pg -e POSTGRES_PASSWORD=pw -p 5520:5432 postgres:18.6-trixie
          docker run -d --platform linux/amd64 --name legx-sys-xrpld -p 6120:6006 -v "$PWD/ci:/etc/xrpld/" \
            rippleci/xrpld:3.4.1 --standalone
          until docker exec legx-sys-pg pg_isready -U postgres; do sleep 2; done
      - name: System tests
        run: pnpm vitest run --project system
      - name: Stop the containers
        if: always()
        run: docker rm -f legx-sys-pg legx-sys-xrpld || true
